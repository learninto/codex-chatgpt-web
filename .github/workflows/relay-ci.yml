name: Relay CI

on:
  push:
    branches: [zero-risk-relay]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: zero-risk-relay
      - name: Apply relay expectation updates
        run: python3 scripts/patch-relay-tests.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run typecheck
      - run: bun test ./tests/chatgpt-web-models.test.ts ./tests/model-catalog.test.ts ./tests/server-models.test.ts
      - run: bun test ./tests
      - name: Commit verified test updates
        if: success()
        run: |
          if git diff --quiet -- tests; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test: cover ChatGPT Web relay route"
          git push origin HEAD:zero-risk-relay
